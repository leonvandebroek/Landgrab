# XcodeGen spec. The .xcodeproj is generated from this file and not committed:
#   brew install xcodegen && xcodegen generate
name: VirtuBattle
options:
  bundleIdPrefix: com.leonvandebroek
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  VirtuBattleCore:
    path: Packages/VirtuBattleCore
targets:
  VirtuBattle:
    type: application
    platform: iOS
    sources:
      - VirtuBattle
    dependencies:
      - package: VirtuBattleCore
        product: GameClient
      - package: VirtuBattleCore
        product: AimingEngine
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: VirtuBattle/Info.plist
      properties:
        CFBundleDisplayName: VirtuBattle
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        # Needed to reach the dev server on your Mac over Wi-Fi (ws:// on the local network).
        NSLocalNetworkUsageDescription: VirtuBattle connects to a game server on your local network during development.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leonvandebroek.virtubattle
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
schemes:
  VirtuBattle:
    build:
      targets:
        VirtuBattle: all
    run:
      config: Debug
    test:
      config: Debug
