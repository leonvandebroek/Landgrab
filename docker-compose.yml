version: '3.9'

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: landgrab
      POSTGRES_USER: landgrab
      # Override via .env file or environment variable
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-Dev_Password1!}"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landgrab -d landgrab"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/Landgrab.Api
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Database=landgrab;Username=landgrab;Password=${POSTGRES_PASSWORD:-Dev_Password1!}
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET environment variable must be set}
      - App__BaseUrl=${APP_URL:-http://localhost}
      - AllowedOrigins__0=http://localhost
    ports:
      - "7000:8080"

  frontend:
    build:
      context: ./frontend/landgrab-ui
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "80:8080"

volumes:
  pgdata:
