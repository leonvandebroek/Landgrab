# https when Nginx Proxy Manager in front of this container says so, else this connection's own scheme.
map $http_x_forwarded_proto $landgrab_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API's own health check, for the deploy script and monitoring.
    location = /health {
        proxy_pass http://backend:8080;
    }

    # Proxy API and SignalR to backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $landgrab_forwarded_proto;
    }

    location /hub/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $landgrab_forwarded_proto;
        proxy_read_timeout 86400;
    }
}
